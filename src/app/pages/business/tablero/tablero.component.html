<div
    class="surface-card border-round-xl border-1 surface-border p-4 mb-3 flex flex-column md:flex-row md:align-items-center justify-content-between gap-3">

    <div class="flex-1 flex align-items-center gap-3">
        <button pButton pRipple type="button" icon="pi pi-arrow-left"
                class="p-button-text p-button-rounded p-button-plain flex-shrink-0"
                pTooltip="Volver a proyectos" tooltipPosition="bottom"
                routerLink="/business/proyectos"></button>

        <div>
            <!-- El nombre viaja en el state de la navegacion y ademas llega en el tablero -->
            <h2 class="text-900 text-2xl font-bold m-0">{{ nombreProyecto || 'Tablero' }}</h2>
            <p class="text-600 mt-2 mb-0">Arrastra las tarjetas para moverlas de columna o cambiarlas de orden.</p>
        </div>
    </div>

    <div class="flex-shrink-0">
        <button pButton pRipple icon="pi pi-th-large" label="Columnas" class="p-button-outlined"
            (click)="verColumnas()"></button>
    </div>
</div>

<div *ngIf="cargando" class="flex justify-content-center py-8">
    <p-progressSpinner strokeWidth="4" [style]="{ width: '3rem', height: '3rem' }"></p-progressSpinner>
</div>

<!--
    cdkDropListGroup conecta solas todas las listas que cuelgan de el, aunque
    esten dentro de otro componente. Sin esto habria que ir pasando los ids de
    unas columnas a otras para que se aceptaran las tarjetas entre si.
-->
<div *ngIf="!cargando && columnas.length" cdkDropListGroup
     class="flex align-items-start gap-3 overflow-x-auto pb-3">

    <app-tablero-columna *ngFor="let columna of columnas; trackBy: porId"
        [columna]="columna"
        (nuevaTarea)="nueva($event)"
        (editarTarea)="editar($event)"
        (soltarTarea)="soltar($event)"></app-tablero-columna>
</div>

<div *ngIf="!cargando && !columnas.length"
     class="surface-card border-1 surface-border border-round-xl text-center py-8">
    <i class="pi pi-th-large text-4xl text-300 block mb-3"></i>
    <p class="text-600 mb-3">Este tablero todavia no tiene columnas.</p>
    <button pButton pRipple icon="pi pi-th-large" label="Configurar columnas" class="p-button-outlined"
        (click)="verColumnas()"></button>
</div>

<app-tablero-form [(visible)]="mostrarFormulario" [tarea]="tareaEnEdicion"
    [nombreColumna]="columnaDestino?.nombre ?? ''" [guardando]="guardando"
    (guardar)="guardar($event)" (eliminar)="confirmarEliminacion($event)"></app-tablero-form>

<p-confirmDialog [style]="{ width: '28rem' }"></p-confirmDialog>
