<div
    class="surface-card border-round-xl border-1 surface-border p-4 mb-3 flex flex-column md:flex-row md:align-items-center justify-content-between gap-3">
    <div class="flex-1">
        <h2 class="text-900 text-2xl font-bold m-0">Usuarios</h2>
        <p class="text-600 mt-2 mb-0">Administra quien tiene acceso a ScrumSoft y con que rol.</p>
    </div>

    <div class="flex-shrink-0">
        <button pButton pRipple icon="pi pi-plus" label="Nuevo usuario" (click)="nuevo()"></button>
    </div>
</div>

<div class="surface-card border-1 surface-border border-round-xl overflow-hidden">

    <!-- Barra de filtros -->
    <div class="p-3 border-bottom-1 surface-border flex flex-column lg:flex-row gap-2 lg:align-items-center justify-content-between">

        <span class="p-input-icon-left w-full lg:w-30rem">
            <i class="pi pi-search"></i>
            <input pInputText type="text" class="w-full" placeholder="Buscar por nombre o correo"
                [(ngModel)]="filtros.busqueda" (ngModelChange)="aplicarFiltros()">
        </span>

        <div class="flex flex-column sm:flex-row gap-2 ">
            <p-dropdown [options]="opcionesRol" optionLabel="label" optionValue="value" placeholder="Todos los roles"
                [showClear]="true" styleClass="w-full sm:w-16rem" [(ngModel)]="filtros.rol"
                (ngModelChange)="aplicarFiltros()"></p-dropdown>

            <p-dropdown [options]="opcionesEstado" optionLabel="label" optionValue="value"
                placeholder="Todos los estados" [showClear]="true" styleClass="w-full sm:w-16rem"
                [(ngModel)]="filtros.estado" (ngModelChange)="aplicarFiltros()"></p-dropdown>
<!-- 
            <button pButton pRipple type="button" icon="pi pi-filter-slash" class="p-button-text"
                pTooltip="Limpiar filtros" tooltipPosition="top" [disabled]="!hayFiltrosActivos"
                (click)="limpiarFiltros()"></button> -->
        </div>
    </div>

    <app-usuarios-list [usuarios]="usuariosVisibles" [cargando]="cargando" (editar)="editar($event)"
        (eliminar)="confirmarEliminacion($event)"></app-usuarios-list>
</div>

<app-usuarios-form [(visible)]="mostrarFormulario" [usuario]="usuarioEnEdicion" [guardando]="guardando"
    (guardar)="guardar($event)"></app-usuarios-form>

<p-confirmDialog [style]="{ width: '28rem' }"></p-confirmDialog>
