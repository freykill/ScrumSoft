<p-dialog [visible]="visible"
          (visibleChange)="visibleChange.emit($event)"
          (onShow)="reiniciar()"
          [header]="esNueva ? 'Nueva tarea' : 'Editar tarea'"
          [modal]="true"
          [draggable]="false"
          [resizable]="false"
          [style]="{ width: '34rem' }"
          [breakpoints]="{ '640px': '92vw' }">

    <form [formGroup]="form" (ngSubmit)="enviar()" class="flex flex-column gap-3 pt-2">

        <!-- La columna es contexto, no un campo: se elige con el + de la columna -->
        <p *ngIf="nombreColumna" class="text-600 text-sm m-0">
            En la columna <span class="text-900 font-medium">{{ nombreColumna }}</span>.
            <span *ngIf="!esNueva">Para cambiarla, arrastra la tarjeta en el tablero.</span>
        </p>

        <div class="flex flex-column gap-2">
            <label for="titulo" class="font-medium text-900">Titulo</label>
            <input pInputText id="titulo" formControlName="titulo" autocomplete="off"
                   placeholder="Que hay que hacer"
                   [class.ng-invalid]="invalido('titulo')" [class.ng-dirty]="invalido('titulo')">
            <small class="p-error" *ngIf="invalido('titulo')">El titulo es obligatorio.</small>
        </div>

        <div class="flex flex-column gap-2">
            <label for="descripcion" class="font-medium text-900">
                Descripcion <span class="text-500 font-normal">(opcional)</span>
            </label>
            <textarea pInputTextarea id="descripcion" formControlName="descripcion" rows="3"
                      placeholder="Detalles, criterios de aceptacion, enlaces"></textarea>
        </div>

        <div class="grid formgrid m-0 gap-3">
            <div class="col flex flex-column gap-2 p-0">
                <label for="prioridad" class="font-medium text-900">Prioridad</label>
                <p-dropdown inputId="prioridad" formControlName="prioridad" appendTo="body"
                            [options]="opcionesPrioridad" optionLabel="label" optionValue="value"
                            styleClass="w-full"></p-dropdown>
            </div>

            <!--
                Los miembros del proyecto, no todos los usuarios: el backend
                exige que el responsable este en el equipo. showClear para poder
                dejarla sin asignar, que manda null y la desasigna.
            -->
            <div class="col flex flex-column gap-2 p-0">
                <label for="responsable" class="font-medium text-900">
                    Responsable <span class="text-500 font-normal">(opcional)</span>
                </label>
                <p-dropdown inputId="responsable" formControlName="idResponsable" appendTo="body"
                            [options]="opcionesResponsable" optionLabel="nombre" optionValue="idUsuario"
                            placeholder="Sin asignar" [showClear]="true" [autoDisplayFirst]="false"
                            styleClass="w-full"></p-dropdown>
            </div>
        </div>

        <small class="text-600 -mt-2" *ngIf="!opcionesResponsable.length">
            Este proyecto no tiene miembros todavia. Agregalos desde su pantalla de miembros.
        </small>
    </form>

    <ng-template pTemplate="footer">
        <!-- El pie del dialogo alinea a la derecha con text-align, no es flex:
             hace falta este contenedor para que el mr-auto de Eliminar empuje -->
        <div class="flex align-items-center justify-content-end gap-2">
            <!-- Eliminar apartado del resto, para no pulsarlo por inercia -->
            <button *ngIf="!esNueva" pButton pRipple type="button" label="Eliminar" icon="pi pi-trash"
                    class="p-button-text p-button-danger mr-auto"
                    (click)="eliminar.emit(tarea!)"></button>
            <button pButton pRipple type="button" label="Cancelar" icon="pi pi-times"
                    class="p-button-text" (click)="cerrar()"></button>
            <button pButton pRipple type="button" label="Guardar" icon="pi pi-check"
                    [loading]="guardando" (click)="enviar()"></button>
        </div>
    </ng-template>
</p-dialog>
