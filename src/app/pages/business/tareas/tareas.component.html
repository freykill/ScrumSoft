<app-page-header titulo="Tareas"
                 descripcion="Todas las tareas del proyecto, con su columna y responsable."
                 [ruta]="ruta">
    <button pButton pRipple icon="pi pi-plus" label="Nueva tarea"></button>
</app-page-header>

<div class="surface-card border-round-xl p-4">
    <p-table [value]="tareas" [rows]="10" [paginator]="tareas.length > 10"
             styleClass="p-datatable-sm" [tableStyle]="{ 'min-width': '58rem' }">

        <ng-template pTemplate="header">
            <tr>
                <th>Titulo</th>
                <th>Columna</th>
                <th>Responsable</th>
                <th>Prioridad</th>
                <th>Creada</th>
                <th style="width: 8rem"></th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-tarea>
            <tr>
                <td>
                    <div class="font-medium text-900">{{ tarea.titulo }}</div>
                    <div class="text-600 text-sm">{{ tarea.descripcion || 'Sin descripcion' }}</div>
                </td>
                <td class="text-600">{{ tarea.nombreColumna }}</td>
                <td [class]="tarea.idResponsable ? 'text-600' : 'text-400 font-italic'">
                    {{ tarea.nombreResponsable }}
                </td>
                <td>
                    <p-tag [value]="tarea.prioridad" [severity]="severidadPrioridad(tarea.prioridad)"></p-tag>
                </td>
                <td class="text-600">{{ tarea.fechaCreacion | date: 'dd/MM/yyyy' }}</td>
                <td class="text-right">
                    <button pButton pRipple icon="pi pi-pencil" pTooltip="Editar"
                            class="p-button-text p-button-rounded mr-1"></button>
                    <button pButton pRipple icon="pi pi-trash" pTooltip="Eliminar"
                            class="p-button-text p-button-rounded p-button-danger"></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center text-600 py-5">No hay tareas en este proyecto.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
