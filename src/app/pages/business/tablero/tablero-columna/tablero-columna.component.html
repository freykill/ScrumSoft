<!-- Ancho fijo: las columnas no se encogen, el tablero scrollea en horizontal -->
<div class="surface-card border-1 surface-border border-round-xl flex flex-column flex-shrink-0"
     style="width: 18rem">

    <div class="p-3 border-bottom-1 surface-border flex align-items-center justify-content-between gap-2">
        <div class="flex align-items-center gap-2 overflow-hidden">
            <span class="font-medium text-900 white-space-nowrap overflow-hidden text-overflow-ellipsis">
                {{ columna.nombre }}
            </span>
            <span class="text-600 text-sm flex-shrink-0">{{ columna.tareas.length }}</span>
        </div>

        <button pButton pRipple type="button" icon="pi pi-plus" pTooltip="Nueva tarea" tooltipPosition="top"
                class="p-button-text p-button-rounded p-button-plain p-button-sm flex-shrink-0"
                (click)="nuevaTarea.emit(columna)"></button>
    </div>

    <!-- min-height para que una columna vacia siga siendo un destino donde soltar -->
    <div cdkDropList [cdkDropListData]="columna" (cdkDropListDropped)="alSoltar($event)"
         class="p-2 flex flex-column gap-2" style="min-height: 8rem">

        <div *ngFor="let tarea of columna.tareas; trackBy: porId" cdkDrag [cdkDragData]="tarea"
             class="surface-ground border-1 surface-border border-round p-3 cursor-pointer"
             (click)="editarTarea.emit(tarea)">

            <!-- Hueco a rayas que queda mientras se arrastra por encima -->
            <div *cdkDragPlaceholder class="border-2 border-dashed surface-border border-round"
                 style="height: 4.5rem"></div>

            <div class="text-900 font-medium mb-2 line-height-3">{{ tarea.titulo }}</div>

            <div class="flex align-items-center justify-content-between gap-2">
                <p-tag [value]="tarea.prioridad" [severity]="severidadPrioridad(tarea.prioridad)"
                       styleClass="text-xs"></p-tag>

                <div class="flex align-items-center gap-2 flex-shrink-0">
                    <i *ngIf="tarea.descripcion" class="pi pi-align-left text-500 text-sm"
                       pTooltip="Tiene descripcion" tooltipPosition="top"></i>

                    <!-- Iniciales y no el nombre: la tarjeta mide 18rem -->
                    <span *ngIf="tarea.idResponsable"
                          class="flex align-items-center justify-content-center border-circle surface-300 text-700 font-medium"
                          style="width: 1.6rem; height: 1.6rem; font-size: .7rem"
                          [pTooltip]="nombreResponsable(tarea.idResponsable)" tooltipPosition="top">
                        {{ inicialesResponsable(tarea.idResponsable) }}
                    </span>
                </div>
            </div>
        </div>

        <div *ngIf="!columna.tareas.length" class="text-600 text-sm text-center py-4">
            Sin tareas
        </div>
    </div>
</div>
