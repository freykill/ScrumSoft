<p-dialog [visible]="visible"
          (visibleChange)="visibleChange.emit($event)"
          (onShow)="reiniciar()"
          [header]="esNuevo ? 'Nuevo usuario' : 'Editar usuario'"
          [modal]="true"
          [draggable]="false"
          [resizable]="false"
          [style]="{ width: '32rem' }"
          [breakpoints]="{ '640px': '92vw' }">

    <form [formGroup]="form" (ngSubmit)="enviar()" class="flex flex-column gap-3 pt-2">

        <div class="flex flex-column gap-2">
            <label for="nombre" class="font-medium text-900">Nombre</label>
            <input pInputText id="nombre" formControlName="nombre" autocomplete="off"
                   placeholder="Nombre y apellido"
                   [class.ng-invalid]="invalido('nombre')" [class.ng-dirty]="invalido('nombre')">
            <small class="p-error" *ngIf="invalido('nombre')">Escribe al menos 3 caracteres.</small>
        </div>

        <div class="flex flex-column gap-2">
            <label for="correo" class="font-medium text-900">Correo electronico</label>
            <input pInputText id="correo" formControlName="correoElectronico" autocomplete="off"
                   placeholder="usuario@scrumsoft.com"
                   [class.ng-invalid]="invalido('correoElectronico')" [class.ng-dirty]="invalido('correoElectronico')">
            <small class="p-error" *ngIf="invalido('correoElectronico')">Escribe un correo valido.</small>
        </div>

        <div class="flex flex-column gap-2">
            <label for="rol" class="font-medium text-900">Rol</label>
            <p-dropdown inputId="rol" formControlName="rol" [options]="opcionesRol"
                        optionLabel="label" optionValue="value" styleClass="w-full"></p-dropdown>
        </div>

        <div class="flex flex-column gap-2">
            <label for="clave" class="font-medium text-900">
                Contrasena
                <span class="text-500 font-normal" *ngIf="!esNuevo">(dejala vacia para no cambiarla)</span>
            </label>
            <p-password inputId="clave" formControlName="clave" [toggleMask]="true" [feedback]="false"
                        styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password"></p-password>
            <small class="p-error" *ngIf="invalido('clave')">Minimo 6 caracteres.</small>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <button pButton pRipple type="button" label="Cancelar" icon="pi pi-times"
                class="p-button-text" (click)="cerrar()"></button>
        <button pButton pRipple type="button" label="Guardar" icon="pi pi-check"
                [loading]="guardando" (click)="enviar()"></button>
    </ng-template>
</p-dialog>
