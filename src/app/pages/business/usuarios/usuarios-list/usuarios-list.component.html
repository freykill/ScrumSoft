<!--
    Sin cabeceras ordenables: en modo lazy el orden lo resolveria el servidor y
    el GET de usuarios no recibe parametro de orden. Sin papelera tampoco: la
    API no tiene DELETE de usuarios.
-->
<p-table [value]="usuarios"
         [lazy]="true"
         [lazyLoadOnInit]="false"
         (onLazyLoad)="alPaginar($event)"
         [loading]="cargando"
         [paginator]="true"
         [first]="primeraFila"
         [rows]="filasPorPagina"
         [totalRecords]="totalElementos"
         [rowsPerPageOptions]="opcionesPagina"
         [showCurrentPageReport]="true"
         currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
         styleClass="p-datatable-sm"
         [tableStyle]="{ 'min-width': '45rem' }">

    <ng-template pTemplate="header">
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th style="width: 11rem">Rol</th>
            <th style="width: 7rem" class="text-right">Acciones</th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-usuario>
        <tr>
            <td class="font-medium text-900">{{ usuario.nombre }}</td>
            <td class="text-600">{{ usuario.correoElectronico }}</td>
            <td>
                <p-tag [value]="usuario.rol" [severity]="severidadRol(usuario.rol)"></p-tag>
            </td>
            <!-- justify-content-end y no text-right: en un flex, text-right no alinea nada -->
            <td class="flex justify-content-end">
                <button pButton pRipple icon="pi pi-pencil" pTooltip="Editar nombre y rol" tooltipPosition="top"
                        class="p-button-text p-button-rounded"
                        (click)="editar.emit(usuario)"></button>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="4" class="text-center py-6">
                <i class="pi pi-users text-4xl text-300 block mb-3"></i>
                <span class="text-600">No hay usuarios para mostrar.</span>
            </td>
        </tr>
    </ng-template>
</p-table>
