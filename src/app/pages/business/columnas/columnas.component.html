<app-page-header titulo="Columnas"
                 descripcion="Las etapas del tablero. El orden aqui es el orden en que se ven."
                 [ruta]="ruta">
    <button pButton pRipple icon="pi pi-plus" label="Nueva columna"></button>
</app-page-header>

<div class="surface-card border-round-xl p-4">
    <p-table [value]="columnas" styleClass="p-datatable-sm" [tableStyle]="{ 'min-width': '45rem' }">

        <ng-template pTemplate="header">
            <tr>
                <th style="width: 6rem" class="text-center">Orden</th>
                <th>Nombre</th>
                <th class="text-center">Tareas</th>
                <th style="width: 13rem"></th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-columna let-i="rowIndex">
            <tr>
                <td class="text-center text-600">{{ columna.orden }}</td>
                <td class="font-medium text-900">{{ columna.nombre }}</td>
                <td class="text-center">
                    <p-tag [value]="columna.cantidadTareas" severity="info"></p-tag>
                </td>
                <td class="text-right">
                    <button pButton pRipple icon="pi pi-arrow-up" pTooltip="Subir"
                            class="p-button-text p-button-rounded mr-1"
                            [disabled]="i === 0" (click)="subir(i)"></button>
                    <button pButton pRipple icon="pi pi-arrow-down" pTooltip="Bajar"
                            class="p-button-text p-button-rounded mr-1"
                            [disabled]="i === columnas.length - 1" (click)="bajar(i)"></button>
                    <button pButton pRipple icon="pi pi-pencil" pTooltip="Renombrar"
                            class="p-button-text p-button-rounded mr-1"></button>
                    <button pButton pRipple icon="pi pi-trash" pTooltip="Eliminar"
                            class="p-button-text p-button-rounded p-button-danger"></button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="4" class="text-center text-600 py-5">Este proyecto no tiene columnas.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
