<div
    class="surface-card border-round-xl border-1 surface-border p-4 mb-3 flex flex-column md:flex-row md:align-items-center justify-content-between gap-3">

    <div class="flex-1 flex align-items-center gap-3">
        <button pButton pRipple type="button" icon="pi pi-arrow-left"
                class="p-button-text p-button-rounded p-button-plain flex-shrink-0"
                pTooltip="Volver a proyectos" tooltipPosition="bottom"
                routerLink="/business/proyectos"></button>

        <div>
            <h2 class="text-900 text-2xl font-bold m-0">Miembros de {{ nombreProyecto || 'este proyecto' }}</h2>
            <p class="text-600 mt-2 mb-0">Quien trabaja en el proyecto y puede tener tareas asignadas.</p>
        </div>
    </div>

    <div class="flex-shrink-0 flex flex-column sm:flex-row gap-2">
        <button pButton pRipple icon="pi pi-table" label="Tablero" class="p-button-outlined"
            (click)="verTablero()"></button>
        <button pButton pRipple icon="pi pi-th-large" label="Columnas" class="p-button-outlined"
            (click)="verColumnas()"></button>
        <button pButton pRipple icon="pi pi-user-plus" label="Agregar miembro"
            (click)="abrirFormulario()"></button>
    </div>
</div>

<div class="surface-card border-1 surface-border border-round-xl overflow-hidden">
    <app-miembros-list [miembros]="miembros" [cargando]="cargando"
        (quitar)="confirmarBaja($event)"></app-miembros-list>
</div>

<app-miembros-form [(visible)]="mostrarFormulario" [sugerencias]="sugerencias" [guardando]="guardando"
    (buscar)="buscarUsuarios($event)" (agregar)="agregar($event)"></app-miembros-form>

<p-confirmDialog [style]="{ width: '28rem' }"></p-confirmDialog>
