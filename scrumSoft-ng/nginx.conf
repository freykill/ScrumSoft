server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La SPA y la API se sirven desde el mismo origen. Por eso el navegador
    # nunca hace una peticion cruzada y no entra en juego CORS: ni preflight,
    # ni cabeceras expuestas, ni credenciales de otro dominio.
    # El frontend compila con urlBackend vacio y pide rutas relativas.

    # Angular resuelve sus propias rutas: cualquier path que no sea un archivo
    # real devuelve index.html. Sin esto, recargar en /tablero daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR arranca como HTTP y pide pasar a WebSocket. Sin las cabeceras de
    # Upgrade el proxy corta ese cambio de protocolo y el tablero se quedaria
    # reconectando por long polling.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una conexion de tiempo real esta minutos sin enviar nada y no por eso
        # esta muerta: el timeout por defecto de un minuto la cerraria.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
