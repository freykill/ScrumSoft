<div
    class="surface-card border-round-xl border-1 surface-border p-4 mb-3 flex flex-column md:flex-row md:align-items-center justify-content-between gap-3">
    <div class="flex-1">
        <a routerLink="/business/proyectos"
           class="text-600 hover:text-primary no-underline text-sm inline-flex align-items-center gap-1 mb-2">
            <i class="pi pi-arrow-left text-xs"></i> Proyectos
        </a>
        <!-- El nombre llega con el tablero; mientras carga no se deja el titulo cojo -->
        <h2 class="text-900 text-2xl font-bold m-0">Columnas de {{ nombreProyecto || 'este proyecto' }}</h2>
        <p class="text-600 mt-2 mb-0">Las etapas del tablero. El orden de aqui es el orden en que se ven.</p>
    </div>

    <div class="flex-shrink-0 flex gap-2">
        <button pButton pRipple icon="pi pi-table" label="Ver tablero" class="p-button-outlined"
            (click)="verTablero()"></button>
        <button pButton pRipple icon="pi pi-plus" label="Nueva columna" (click)="nueva()"></button>
    </div>
</div>

<div class="surface-card border-1 surface-border border-round-xl overflow-hidden">
    <app-columnas-list [columnas]="columnas" [cargando]="cargando"
        (subir)="subir($event)" (bajar)="bajar($event)"
        (renombrar)="renombrar($event)"
        (eliminar)="confirmarEliminacion($event)"></app-columnas-list>
</div>

<app-columnas-form [(visible)]="mostrarFormulario" [columna]="columnaEnEdicion" [guardando]="guardando"
    (guardar)="guardar($event)"></app-columnas-form>

<p-confirmDialog [style]="{ width: '28rem' }"></p-confirmDialog>
